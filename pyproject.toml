[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "claimguard-mlops"
version = "0.1.0"
description = "Production-style MLOps portfolio project for predicting stuck claim workflows."
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [{ name = "Jay" }]
dependencies = [
  "fastapi>=0.128,<1.0",
  "joblib>=1.5,<2.0",
  "numpy>=2.2,<3.0",
  "pandas>=2.2,<3.0",
  "pydantic>=2.10,<3.0",
  "scikit-learn>=1.8,<2.0",
  "uvicorn[standard]>=0.35,<1.0",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=8.3,<10.0",
  "pytest-cov>=6.0,<8.0",
  "ruff>=0.12,<1.0",
]

[project.scripts]
claimguard-generate = "claimguard.data.generate:main"
claimguard-train = "claimguard.models.train:main"

[tool.hatch.build.targets.wheel]
packages = ["src/claimguard"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
